<body>

    <nav class="navbar" id="navbar">
        <div class="container nav-flex">

                    <img src="images/logo.png" alt="浙江伟丰新材料有限公司 Logo">
                </a>

            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">首页</a></li>

                <li><a href="products.html" data-i18n="nav.products">产品中心</a></li>

                <li><a href="gallery.html" data-i18n="nav.gallery">企业形象</a></li>

            </ul>

    <header class="page-header contact-header-bg">
        <div class="overlay"></div>
        <div class="container header-content">
            <h1 class="fade-in-up" data-i18n="contact.header_title">真诚服务 客户至上</h1>
            <p class="fade-in-up delay-200" data-i18n="contact.header_desc">以优质服务赢得客户满意 · 专业专注 · 值得信赖</p>
        </div>
    </header>

    <section class="section contact-section">
        <div class="container">
            <div class="contact-wrapper reveal">
                
                <div class="contact-info-box">
                    <div class="info-header">
                        <h2 data-i18n="contact.info_title">联系方式</h2>
                        <div class="small-line"></div>
                        <p data-i18n="contact.info_sub">期待您与伟丰联系，我们将竭诚为您服务</p>
                    </div>

                    <div class="info-list">
                        <div class="info-group">
                            <h3><i class="fas fa-building"></i> <span data-i18n="contact.co_name">浙江伟丰新材料有限公司</span></h3>
                            <ul>
                                <li><span class="label" data-i18n="contact.label_tel">电话:</span> <span class="value">0570-4051365</span></li>
                                <li><span class="label" data-i18n="contact.label_fax">传真:</span> <span class="value">0570-4332762</span></li>
                                <li><span class="label" data-i18n="contact.label_addr">地址:</span> <span class="value" data-i18n="footer.addr_text">浙江省江山市经济技术开发区兴工八二路1号</span></li>
                            </ul>
                        </div>
                        <hr class="divider">
                        <div class="info-group">
                            <h3><i class="fas fa-map-marked-alt"></i> <span data-i18n="contact.office_name">绍兴办事处</span></h3>
                            <ul>
                                <li><span class="label" data-i18n="contact.label_fax">传真:</span> <span class="value">0575-84574094</span></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="contact-map-box">
                    <div id="amapContainer" style="width: 100%; height: 100%; min-height: 400px; border-radius: 12px; overflow: hidden;">
                        </div>
                </div>

            </div>
        </div>
    </section>

    <footer id="contact">
        </footer>

    <script type="text/javascript">
    window.onload = function() {
        // 1. 准确的坐标（请确保这两处数字完全一致）
        var myLngLat = [118.726677,28.812076]; // ← 把这里换成你拾取的准确经纬度

        // 2. 初始化地图
        var map = new AMap.Map('amapContainer', {
            zoom: 16,           // 缩放级别，16 比较合适
            center: myLngLat,   // 地图中心点
            viewMode: '3D'
        });

        // 3. 创建并添加标点（这就是那个“标点”）
        var myIcon = new AMap.Icon({
            image: 'images/logo.png',      // 1. 指向你的 logo 文件 (请确保文件存在)
            size: new AMap.Size(40, 40),          // 2. 容器大小 (设为 40x40px)
            imageSize: new AMap.Size(40, 40),     // 3. 图片缩放后的大小 (设为 40x40px)
            offset: new AMap.Pixel(-20, -40)       // 4. 偏移量： half width, full height (让底部中点对齐经纬度)
        });

        // 创建标点并使用自定义图标
        var marker = new AMap.Marker({
            position: myLngLat, // 标点的位置
            map: map,           // 将标点添加到地图
            icon: myIcon,       // 【关键】：使用上面定义的自定义图标 myIcon
            title: '浙江伟丰新材料有限公司' // 鼠标悬停时显示的文字
        });

        // 4. 可选：点击标点弹出一个信息卡片
        var infoWindow = new AMap.InfoWindow({
            content: '<div style="padding:10px; color:#333;"><b>浙江伟丰新材料有限公司</b><br>江山市兴工八二路1号</div>',
            offset: new AMap.Pixel(0, -30)
        });

        marker.on('click', function() {
            infoWindow.open(map, myLngLat);
        });
    };
    </script>
    <script src="script.js"></script>
</body>
</html>
